# CME events for the data assimilation runs (read by da_surf_setup.py).
#
# Choose the event in da_surf_setup.Setup.get_ssw_event_craft (ssw_event = "...").
# To add an event, copy an entry and change the values.
#
#   model_start     start time of the model run (UTC), for runs with real observations
#   obs_file        observation file, in the OBS_DIR folder set in .env
#   first_guess     first-guess CME from the DONKI catalogue (around which the prior is drawn):
#     time_at_21rs  time the CME is at 21.5 solar radii (UTC)
#     speed         km/s
#     width         full angular width, deg
#     lon, lat      direction, deg (HEEQ)
#     thick         thickness, solar radii
#   first_guess_other   the non-DONKI first guess, used when donki_cme = False in
#                       initialise_fg_cme_parameters (only the ssw events have one; the others use
#                       first_guess for both)
#
# Used by osse_ana.py (analysis of the runs):
#   arrival_time    observed arrival time of the CME at Earth (UTC)
#   title           figure title; {event} and {craft_name} (e.g. STEREO-A) are filled in
#                   (default: CME-{event})
#   prior_dir, prior_dir_other
#                   run folder of the prior made from first_guess / first_guess_other, for events
#                   whose runs use older folder names (default: prior_<speed>_<width>_<lon>_<lat>_<thick>
#                   from the first guess, as data_assimilation_routine.py names it)
#   obs_times_sta, obs_times_stb
#                   observation times for each spacecraft, for events whose observations osse_ana.py does
#                   not read from obs_file (the ssw events)
#
# Times are written YYYY-MM-DD HH:MM (or HH:MM:SS).
#
# Twin experiments (synthetic observations): entries with a truth. Run one by setting ssw_event in
# da_surf_setup.Setup.get_ssw_event_craft to its name (e.g. "twin"); a real event code with
# get_use_synthetic_obs returning True uses "twin". Copy an entry to set up another twin experiment.
#
#   model_start     start time of the model run (UTC)
#   truth           CME the synthetic observations are made from ("truth run"):
#     launch_time   time the CME is at the model's inner boundary (cme_init_rad) (UTC)
#     speed         km/s
#     width         full angular width, deg
#     lon, lat      direction, deg (HEEQ); "earth" = Earth's direction at model_start
#     thick         thickness, solar radii
#   first_guess     first-guess CME (around which the prior is drawn), same fields as truth
#   lat_min,        latitude range of the SURF3d grid (compress_surf3d), deg; optional, default
#   lat_max           -30 and 30. Used for the truth run and every ensemble member; it must cover the
#                     CME (lat +- width / 2) and the observer's field of view
#
# For a set of runs of a twin experiment (n_runs > 1, run_start >= 0), optional:
#   sample_first_guess     true: each run's first guess is a draw from the prior around the truth
#                          (the same distribution as the ensemble), so the filter starts as wrong as
#                          it assumes; first_guess is then not needed. Negative run numbers start
#                          from the truth itself. false (default): every run starts from first_guess
#   new_obs_noise_per_run  true: each run gets its own observation noise (seeded by the run number);
#                          false (default): every run sees the same noisy observations
# Either one adds a tag (fgs, ons) to the run folder.
#
# osse_ana.py reads the same entry (event "twin"); the run folders are named from these values.

twin_hi_speed:
  model_start: 2012-01-01 00:00
  lat_min: -20
  lat_max: 20
  truth:
    launch_time: 2012-01-01 01:00
    speed: 495
    width: 37.4
    lon: 0
    lat: 0
    thick: 0
  first_guess:
    launch_time: 2012-01-01 01:00
    speed: 600
    width: 37.4
    lon: 0
    lat: 0
    thick: 0

